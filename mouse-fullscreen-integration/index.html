<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;}
  #screen{width:100%;height:100%;position:relative;}
  #fullscreen-button{
    position:absolute;
    left:50%;
    top:12px;
    transform:translateX(-50%);
    padding:12px 18px;
    font-size:16px;
    border:none;
    border-radius:999px;
    background:#ffffffee;
    color:#000;
    cursor:pointer;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:10;
  }
  #fullscreen-button.visible{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
</style>
</head>
<body>
<div id="screen">
  <button id="fullscreen-button" type="button">Full Screen</button>
</div>
<script>
const screen = document.getElementById('screen');
const fullscreenButton = document.getElementById('fullscreen-button');
let startX, startY;
let flashInterval;
let holdTimer;
let hideButtonTimer;
let holdTriggered = false;

function setColor(c){ screen.style.background = c; }

function flashRed(times, done){
  let count = 0;
  let on = false;
  setColor('#000');
  flashInterval = setInterval(()=>{
    on = !on;
    setColor(on ? '#ff0000' : '#000');
    count++;
    if(count >= times*2){
      clearInterval(flashInterval);
      setColor('#ff0000');
      if(done) done();
    }
  }, 250);
}

function handleSwipe(endX, endY){
  if(holdTriggered){
    holdTriggered = false;
    return;
  }

  const dx = endX - startX;
  const dy = endY - startY;
  const absX = Math.abs(dx), absY = Math.abs(dy);
  const threshold = 40;

  clearInterval(flashInterval);

  if(absX < threshold && absY < threshold){
    // tap -> red flashing then solid red
    flashRed(4);
  } else if(absY > absX && dy > threshold){
    // swipe down -> black
    setColor('#000');
  } else if(absX > absY){
    // swipe sideways -> green
    setColor('#00ff00');
  }
}

function showFullscreenButton(){
  holdTriggered = true;
  fullscreenButton.classList.add('visible');
  clearTimeout(hideButtonTimer);
  hideButtonTimer = setTimeout(() => {
    fullscreenButton.classList.remove('visible');
  }, 5000);
}

async function enterFullscreen(){
  if(document.fullscreenElement) return;
  try{
    await screen.requestFullscreen();
  } catch (err) {
    console.warn('Fullscreen request failed:', err);
  }
}

document.addEventListener('pointerdown', e => {
  startX = e.clientX;
  startY = e.clientY;
  holdTriggered = false;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(showFullscreenButton, 3000);
});

document.addEventListener('pointerup', e => {
  clearTimeout(holdTimer);
  handleSwipe(e.clientX, e.clientY);
});

document.addEventListener('pointercancel', () => clearTimeout(holdTimer));

document.addEventListener('pointermove', e => {
  if(!holdTimer) return;
  if(Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10){
    clearTimeout(holdTimer);
  }
});

fullscreenButton.addEventListener('pointerdown', e => e.stopPropagation());
fullscreenButton.addEventListener('pointerup', e => e.stopPropagation());
fullscreenButton.addEventListener('click', enterFullscreen);

// prevent scrolling/zooming
document.addEventListener('gesturestart', e=>e.preventDefault());
</script>
</body>
</html>
